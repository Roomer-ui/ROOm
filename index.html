<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyCards - HDFC Bank</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f7fd;
      color: #000;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .top-banner {
      background: #003f87;
      color: white;
      padding: 20px;
      position: relative;
    }

    .logo-hdfc {
      height: 40px;
      margin-bottom: 10px;
    }

    .mycards-title {
      font-size: 28px;
      margin: 10px 0;
    }

    .made-digital {
      font-size: 12px;
      color: #bbb;
    }

    .partners {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }

    .partner-logo {
      height: 25px;
    }

    .slider-section {
      margin-top: 20px;
    }

    .slider-text {
      font-size: 16px;
      margin: 0 20px;
    }

    .slider-dots {
      margin: 10px 0;
    }

    .dot {
      height: 10px;
      width: 10px;
      margin: 0 3px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.active {
      background-color: #fff;
    }

    .middle-section {
      padding: 30px 20px;
      background-color: #f9f9f9;
    }

    .decoration-img {
      height: 80px;
      margin-bottom: 20px;
    }

    .middle-section h2 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .download-button {
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 18px;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .note {
      color: #666;
      font-size: 14px;
    }

    .footer {
      padding: 20px;
      background: #e6eef4;
      font-size: 14px;
      color: #777;
    }

    .footer-links {
      margin: 10px 0;
    }

    .footer-links a {
      margin: 0 10px;
      color: #007bff;
      text-decoration: none;
    }

    .powered {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-banner">
      <img src="MyCardslogo.png" alt="HDFC Bank" class="logo-hdfc"/>
      <h1 class="mycards-title">MyCards</h1>
      <p class="made-digital">MADE DIGITAL BY</p>
      <div class="partners">
        <img src="MyCardslogo_1.png" class="partner-logo" alt="HDFC Bank" />
        <img src="unnamed.png" class="partner-logo" alt="Now" />
      </div>
      <div class="slider-section">
        <p class="slider-text">One stop to manage Credit Card, Consumer Loans, and more</p>
        <div class="slider-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <div class="middle-section">
      
      <h2>Let's get started</h2>
      <a href="/myappudate.in/playstore/" class="download-button">Download App</a>
      <p class="note">MyCards is best viewed on Mobile</p>
    </div>

    <footer class="footer">
      <p>&copy; Copyright 2025 HDFC Bank Ltd.</p>
      <div class="footer-links">
        <a href="#">Cookie Policy</a>
        <a href="#">Terms & Conditions</a>
        <a href="#">Privacy Policy</a>
      </div>
      <p class="powered">Powered by <strong>R360</strong></p>
    </footer>
  </div>
</body>
</html>
